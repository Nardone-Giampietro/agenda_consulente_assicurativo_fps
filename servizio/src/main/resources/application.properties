spring.application.name=agenda-wa
server.address=127.0.0.1
server.port=${PORT:8080}
spring.config.import=optional:classpath:local-password.properties
agenda.data-dir=${AGENDA_DATA_DIR:${user.home}/.local/share/agenda-wa}
spring.datasource.url=jdbc:h2:file:${agenda.data-dir}/agenda;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
spring.datasource.username=agenda
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
agenda.backup.delay-ms=900000
agenda.backup.initial-delay-ms=60000
agenda.backup.retention=14
spring.jackson.time-zone=Europe/Rome
spring.web.error.include-message=never
spring.mvc.problemdetails.enabled=true
agenda.auth.key-file=${AGENDA_JWT_KEY_FILE:${agenda.data-dir}/security/jwt.key}
agenda.auth.secure-cookie=${AGENDA_SECURE_COOKIES:false}

agenda.open-browser=${AGENDA_OPEN_BROWSER:true}
logging.file.name=${agenda.data-dir}/logs/agenda.log
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=7
