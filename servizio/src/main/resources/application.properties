spring.application.name=agenda-wa
server.address=127.0.0.1
server.port=${PORT:8080}
spring.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27018/agenda_wa?replicaSet=rs0&serverSelectionTimeoutMS=5000}
spring.data.mongodb.auto-index-creation=true
spring.jackson.time-zone=Europe/Rome
spring.web.error.include-message=never
spring.mvc.problemdetails.enabled=true
agenda.auth.key-file=${AGENDA_JWT_KEY_FILE:.local/security/jwt.key}
agenda.auth.secure-cookie=${AGENDA_SECURE_COOKIES:false}
